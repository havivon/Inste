name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the SDK already; setup-android@v3 only gets in
      # the way by trying to install the retired "tools" package.
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk reels-lab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reels-lab-debug-apk
          path: reels-lab.apk
          if-no-files-found: error

      # A release asset is a direct .apk link, so the phone can install it
      # without unpacking an artifact zip first.
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" reels-lab.apk \
            --target "$GITHUB_SHA" \
            --title "Reels Lab APK #${{ github.run_number }}" \
            --notes "Debug build of ${GITHUB_SHA:0:7}. Sideload it: Android will ask to allow installs from an unknown source."
